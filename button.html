        // --- Main App Component ---

        function ButtonEmporium() {
          const [currentView, setCurrentView] = useState('home');
          const [activeCategory, setActiveCategory] = useState('all');
          const [cart, setCart] = useState([]);
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [isCartOpen, setIsCartOpen] = useState(false);
          const [clickCount, setClickCount] = useState(0);
          const [bigButtonState, setBigButtonState] = useState('idle');

          const addToCart = (product) => {
            setCart(prevCart => {
              const existingItem = prevCart.find(item => item.id === product.id);
              if (existingItem) {
                // If exists, increment quantity
                return prevCart.map(item => 
                  item.id === product.id 
                    ? { ...item, quantity: item.quantity + 1 } 
                    : item
                );
              }
              // If new, add with quantity 1
              return [...prevCart, { ...product, quantity: 1 }];
            });
            setIsCartOpen(true);
          };

          const updateQuantity = (productId, delta) => {
            setCart(prevCart => prevCart.map(item => {
              if (item.id === productId) {
                return { ...item, quantity: Math.max(1, item.quantity + delta) };
              }
              return item;
            }));
          };

          const removeFromCart = (productId) => {
            setCart(prevCart => prevCart.filter(item => item.id !== productId));
          };

          // Calculate total with quantity
          const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
          
          // Calculate total items for badge
          const cartItemCount = cart.reduce((sum, item) => sum + item.quantity, 0);

          const handleBigButtonPress = () => {
            setBigButtonState('pressed');
            setClickCount(prev => prev + 1);
            setTimeout(() => setBigButtonState('idle'), 150);
          };

          const navItems = [
            { id: 'home', label: 'Home' },
            { id: 'about', label: 'About' },
            { id: 'store', label: 'Store' },
            { id: 'explore', label: 'Exploration' },
          ];

          return (
            <div className="min-h-screen bg-stone-50 font-sans text-stone-800 selection:bg-amber-200 flex flex-col">
              
              {/* Cart Drawer */}
              <CartDrawer 
                isOpen={isCartOpen} 
                onClose={() => setIsCartOpen(false)} 
                cart={cart}
                updateQuantity={updateQuantity}
                removeFromCart={removeFromCart}
                total={cartTotal}
              />

              {/* Navigation */}
              <nav className="sticky top-0 z-50 bg-stone-900 text-stone-50 shadow-lg border-b-4 border-stone-700">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex justify-between h-16 items-center">
                    {/* Logo */}
                    <div 
                      className="flex items-center gap-2 cursor-pointer touch-manipulation"
                      onClick={() => setCurrentView('home')}
                    >
                      <div className="w-8 h-8 rounded-full bg-amber-500 border-2 border-amber-300 shadow-[0_0_10px_rgba(245,158,11,0.5)] flex items-center justify-center">
                        <div className="w-2 h-2 rounded-full bg-stone-900/20"></div>
                        <div className="w-2 h-2 rounded-full bg-stone-900/20 ml-1"></div>
                      </div>
                      <span className="font-bold text-xl tracking-tight">Push & Sew</span>
                    </div>

                    {/* Desktop Nav */}
                    <div className="hidden md:flex space-x-1">
                      {navItems.map(item => (
                        <button
                          key={item.id}
                          onClick={() => setCurrentView(item.id)}
                          className={`
                            px-4 py-2 rounded-lg text-sm font-bold transition-all
                            ${currentView === item.id 
                              ? 'bg-stone-800 text-amber-400 shadow-inner' 
                              : 'text-stone-400 hover:text-white hover:bg-stone-800/50'}
                          `}
                        >
                          {item.label}
                        </button>
                      ))}
                    </div>

                    <div className="flex items-center gap-4">
                      <button 
                        onClick={() => setIsCartOpen(true)}
                        className="relative group p-2 hover:bg-stone-800 rounded-lg transition-colors touch-manipulation"
                      >
                        <ShoppingCart className="w-6 h-6 text-stone-300 group-hover:text-white transition-colors" />
                        {cartItemCount > 0 && (
                          <span className="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-stone-900 transform translate-x-1/4 -translate-y-1/4 bg-amber-400 rounded-full shadow-sm border border-stone-900">
                            {cartItemCount}
                          </span>
                        )}
                      </button>

                      <button className="md:hidden p-2 hover:bg-stone-800 rounded-lg touch-manipulation" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                        {isMenuOpen ? <X className="text-stone-300" /> : <Menu className="text-stone-300" />}
                      </button>
                    </div>
                  </div>
                </div>
                
                {/* Mobile Menu */}
                {isMenuOpen && (
                  <div className="md:hidden bg-stone-800 border-t border-stone-700 animate-in slide-in-from-top-2">
                    {navItems.map(item => (
                      <button
                        key={item.id}
                        onClick={() => { setCurrentView(item.id); setIsMenuOpen(false); }}
                        className={`
                          block w-full text-left px-6 py-4 text-base font-bold border-b border-stone-700 touch-manipulation
                          ${currentView === item.id ? 'text-amber-400 bg-stone-900' : 'text-stone-300 active:bg-stone-700'}
                        `}
                      >
                        {item.label}
                      </button>
                    ))}
                  </div>
                )}
              </nav>

              {/* Main Content Area */}
              <main className="flex-grow">
                {currentView === 'home' && (
                  <HomePage 
                    navigate={setCurrentView} 
                    clickCount={clickCount} 
                    handleBigButtonPress={handleBigButtonPress}
                    bigButtonState={bigButtonState}
                    setBigButtonState={setBigButtonState}
                  />
                )}
                
                {currentView === 'store' && (
                  <StorePage 
                    activeCategory={activeCategory} 
                    setActiveCategory={setActiveCategory} 
                    addToCart={addToCart} 
                  />
                )}
                
                {currentView === 'about' && <AboutPage />}
                
                {currentView === 'explore' && <ExplorePage />}
              </main>

              {/* Footer */}
              <footer className="bg-stone-950 text-stone-500 py-8 border-t border-stone-900">
                <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-6">
                  <div className="flex items-center gap-2">
                    <div className="w-6 h-6 rounded-full bg-stone-800 flex items-center justify-center">
                      <div className="w-1 h-1 rounded-full bg-stone-500"></div>
                      <div className="w-1 h-1 rounded-full bg-stone-500 ml-[2px]"></div>
                    </div>
                    <span className="font-bold text-stone-300">Push & Sew</span>
                  </div>
                  <div className="flex gap-6 text-sm font-medium">
                    <button onClick={() => setCurrentView('about')} className="hover:text-amber-400 touch-manipulation">About</button>
                    <button onClick={() => setCurrentView('store')} className="hover:text-amber-400 touch-manipulation">Store</button>
                    <button onClick={() => setCurrentView('explore')} className="hover:text-amber-400 touch-manipulation">Exploration</button>
                  </div>
                  <div className="text-sm">
                    © 2024 Push & Sew Emporium.
                  </div>
                </div>
              </footer>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ButtonEmporium />);
    </script>
</body>
</html>
