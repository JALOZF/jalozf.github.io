<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons: Of the World</title>
    <style>
        /* 1. Global Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* 2. Main Card Container */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(10px);
            /* Glassmorphism effect */
        }

        /* 3. Typography */
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
            font-weight: 700;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /* 4. List Styling */
        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 5. Button/Link Styling */
        a {
            text-decoration: none;
            background-color: white;
            color: #4a4a4a;
            padding: 15px 20px;
            border-radius: 12px;
            border: 2px solid #eee;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            /* Aligns text and icon */
            gap: 15px;
        }

        /* Hover Effects */
        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-color: #764ba2;
            color: #764ba2;
        }

        /* 6. Icons (SVG Styling) */
        svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .card {
                padding: 2rem;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
