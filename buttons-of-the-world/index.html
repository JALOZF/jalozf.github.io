<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons: Of the World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
        }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-6">

    <!-- Header -->
    <header class="text-center mb-12">
        <h1 class="text-4xl md:text-6xl font-extrabold text-gray-800 mb-2 tracking-tight">
            Buttons: <span class="text-indigo-600">Of the World</span>
        </h1>
        <p class="text-gray-500 text-lg">Select your destination</p>
    </header>

    <!-- Main Grid Container -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl w-full">

        <!-- Card 1: Website -->
        <a href="site.html"
            class="group block relative bg-white rounded-3xl overflow-hidden shadow-lg card-hover border-b-8 border-blue-500 h-80 flex flex-col">
            <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                <i class="fas fa-globe fa-8x text-blue-500"></i>
            </div>
            <div class="p-8 flex-grow flex flex-col justify-between z-10">
                <div
                    class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-300">
                    <i class="fas fa-laptop-code text-2xl text-blue-600"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">The Website</h2>
                    <p class="text-gray-500 text-sm">Visit the main site to explore content directly.</p>
                </div>
                <div
                    class="mt-4 flex items-center text-blue-600 font-semibold group-hover:translate-x-2 transition-transform">
                    <span>Go to Site</span>
                    <i class="fas fa-arrow-right ml-2"></i>
                </div>
            </div>
        </a>

        <!-- Card 2: Presentation -->
        <a href="https://docs.google.com/presentation/d/1ROXKjIZiT3bkjCakPs30GBzAXoDMBgJsfXLd1b0EfR8/edit?usp=sharing"
            target="_blank"
            class="group block relative bg-white rounded-3xl overflow-hidden shadow-lg card-hover border-b-8 border-yellow-500 h-80 flex flex-col">
            <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                <i class="fas fa-chalkboard-user fa-8x text-yellow-500"></i>
            </div>
            <div class="p-8 flex-grow flex flex-col justify-between z-10">
                <div
                    class="w-16 h-16 bg-yellow-100 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-300">
                    <i class="fas fa-file-powerpoint text-2xl text-yellow-600"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">The Presentation</h2>
                    <p class="text-gray-500 text-sm">View the Google Slides deck for deep context.</p>
                </div>
                <div
                    class="mt-4 flex items-center text-yellow-600 font-semibold group-hover:translate-x-2 transition-transform">
                    <span>Open Slides</span>
                    <i class="fas fa-arrow-right ml-2"></i>
                </div>
            </div>
        </a>

        <!-- Card 3: Jingle -->
        <a href="https://suno.com/s/Nl8KkvtD1TfIHj1t" target="_blank"
            class="group block relative bg-white rounded-3xl overflow-hidden shadow-lg card-hover border-b-8 border-pink-500 h-80 flex flex-col">
            <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                <i class="fas fa-music fa-8x text-pink-500"></i>
            </div>
            <div class="p-8 flex-grow flex flex-col justify-between z-10">
                <div
                    class="w-16 h-16 bg-pink-100 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-300">
                    <i class="fas fa-headphones text-2xl text-pink-600"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">The Jingle</h2>
                    <p class="text-gray-500 text-sm">Listen to the Suno AI generated theme song.</p>
                </div>
                <div
                    class="mt-4 flex items-center text-pink-600 font-semibold group-hover:translate-x-2 transition-transform">
                    <span>Listen Now</span>
                    <i class="fas fa-play ml-2"></i>
                </div>
            </div>
        </a>

    </div>

    <footer class="mt-12 text-gray-400 text-sm">
        &copy; 2024 Buttons of the World
    </footer>

</body>

</html>
