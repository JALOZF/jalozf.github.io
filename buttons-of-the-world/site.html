          specs: ["Vacuum Chamber", "Pressure Pot (60psi)", "UV Curing Box"]

      const workshops = [
        { title: "Switch Lubing 101", date: "Sat, Oct 14", slots: "3/8", type: "Tech" },
        { title: "Intro to Mold Casting", date: "Sun, Oct 15", slots: "FULL", type: "Craft" },
        { title: "Sewing on Shank Buttons", date: "Wed, Oct 18", slots: "5/10", type: "Sewing" },
      ];

      return (
        <div className="max-w-6xl mx-auto px-4 py-16 animate-in fade-in duration-500 relative">

          {/* Equipment List Modal */}
          {showEquipmentModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center px-4">
              <div className="absolute inset-0 bg-stone-900/60 backdrop-blur-sm animate-in fade-in" onClick={() => setShowEquipmentModal(false)}></div>
              <div className="relative bg-white rounded-2xl p-8 max-w-2xl w-full shadow-2xl animate-in zoom-in-95 duration-200 border border-stone-100 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-6 border-b border-stone-100 pb-4">
                  <h3 className="text-2xl font-bold font-serif flex items-center gap-2">
                    <ClipboardList size={24} className="text-yellow-600" /> Lab Equipment Inventory
                  </h3>
                  <button onClick={() => setShowEquipmentModal(false)} className="p-2 hover:bg-stone-100 rounded-full transition-colors"><X size={20} /></button>
                </div>
                <div className="grid md:grid-cols-2 gap-8">
                  {equipmentInventory.map((section, idx) => (
                    <div key={idx}>
                      <h4 className="font-bold text-stone-900 mb-3 uppercase tracking-wider text-xs border-l-4 border-yellow-400 pl-2">{section.category}</h4>
                      <ul className="space-y-2">
                        {section.items.map((item, i) => (
                          <li key={i} className="text-stone-600 text-sm flex items-center gap-2">
                            <span className="w-1 h-1 bg-stone-300 rounded-full"></span> {item}
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </div>
                <div className="mt-8 pt-6 border-t border-stone-100 text-center">
                  <p className="text-stone-500 text-sm italic mb-4">All equipment is free to use for members after completing the safety orientation.</p>
                  <button onClick={() => setShowEquipmentModal(false)} className="px-6 py-2 bg-stone-100 hover:bg-stone-200 text-stone-900 font-bold rounded-lg transition-colors">Close Inventory</button>
                </div>
              </div>
            </div>
          )}

          {/* Info Card Modal/Overlay */}
          {activeInfoCard && (
            <div className="fixed inset-0 z-50 flex items-center justify-center px-4">
              <div className="absolute inset-0 bg-stone-900/60 backdrop-blur-sm animate-in fade-in" onClick={() => setActiveInfoCard(null)}></div>
              <div className="relative bg-white rounded-2xl p-8 max-w-lg w-full shadow-2xl animate-in zoom-in-95 duration-200 border border-stone-100">
                <button onClick={() => setActiveInfoCard(null)} className="absolute top-4 right-4 p-2 hover:bg-stone-100 rounded-full transition-colors"><X size={20} /></button>
                <div className="flex items-center gap-4 mb-6">
                  <div className="w-12 h-12 bg-yellow-100 rounded-xl flex items-center justify-center text-yellow-600">
                    {React.createElement(infoCards[activeInfoCard].icon, { size: 24 })}
                  </div>
                  <h3 className="text-2xl font-bold font-serif">{infoCards[activeInfoCard].title}</h3>
                </div>
                <p className="text-stone-600 leading-relaxed mb-6">{infoCards[activeInfoCard].content}</p>
                <div>
                  <h4 className="font-bold text-sm text-stone-900 uppercase tracking-widest mb-3">Specifications</h4>
                  <ul className="space-y-2">
                    {infoCards[activeInfoCard].specs.map((spec, i) => (
                      <li key={i} className="flex items-center gap-2 text-sm text-stone-600">
                        <div className="w-1.5 h-1.5 bg-yellow-400 rounded-full"></div> {spec}
                      </li>
                    ))}
                  </ul>
                </div>
                <button onClick={() => setActiveInfoCard(null)} className="mt-8 w-full py-3 bg-stone-900 text-white rounded-xl font-bold hover:bg-stone-800 transition-colors">Close Info</button>
              </div>
            </div>
          )}

          <div className="grid lg:grid-cols-2 gap-16 items-center mb-20">
            <div className="space-y-6">
              <div className="inline-flex items-center gap-2 text-yellow-600 font-bold bg-yellow-50 px-4 py-2 rounded-lg border border-yellow-200">
                <Cpu size={18} /> The Maker Lab
              </div>
              <h2 className="text-4xl md:text-5xl font-black text-stone-900 font-serif">
                Create Your Own <span className="text-gold-gradient italic">Snap</span>
              </h2>
              <p className="text-xl text-stone-600 font-light">
                Don't just push buttons—build them. Our open-bench lab provides the tools, the molds, and the soldering irons you need to create your own custom fasteners and switches.
              </p>
              <p className="text-sm text-stone-400 italic">Click a station to view equipment details.</p>
              <div className="flex gap-4 pt-4">
                <button
                  onClick={() => { setBenchBooked(true); setTimeout(() => setBenchBooked(false), 3000); }}
                  className={`px-6 py-3 rounded-xl font-bold transition-all font-serif flex items-center gap-2 ${benchBooked ? 'bg-green-600 text-white' : 'bg-stone-900 text-white hover:bg-stone-800'}`}
                >
                  {benchBooked ? <><CheckCircle size={18} /> Bench Reserved</> : 'Book a Bench'}
                </button>
                <button
                  onClick={() => setShowEquipmentModal(true)}
                  className="px-6 py-3 bg-white border-2 border-stone-200 text-stone-900 rounded-xl font-bold hover:border-yellow-400 transition-colors font-serif"
                >
                  View Equipment List
                </button>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-4">
              <button
                onClick={() => setActiveInfoCard('design')}
                className="bg-stone-200 rounded-2xl h-48 flex items-center justify-center p-8 text-center hover:bg-yellow-400 transition-colors cursor-pointer group relative overflow-hidden"
              >
                <div className="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity"><Info size={16} /></div>
                <div>
                  <PenTool className="w-10 h-10 mx-auto mb-2 text-stone-500 group-hover:text-stone-900" />
                  <div className="font-bold text-stone-700 group-hover:text-stone-900">Design Station</div>
                </div>
              </button>
              <button
                onClick={() => setActiveInfoCard('print')}
                className="bg-stone-800 rounded-2xl h-48 flex items-center justify-center p-8 text-center mt-8 hover:bg-yellow-400 transition-colors cursor-pointer group relative overflow-hidden"
              >
                <div className="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity text-stone-900"><Info size={16} /></div>
                <div>
                  <Layers className="w-10 h-10 mx-auto mb-2 text-stone-400 group-hover:text-stone-900" />
                  <div className="font-bold text-stone-300 group-hover:text-stone-900">3D Printing</div>
                </div>
              </button>
              <button
                onClick={() => setActiveInfoCard('solder')}
                className="bg-stone-100 rounded-2xl h-48 flex items-center justify-center p-8 text-center border-2 border-dashed border-stone-300 hover:border-yellow-400 hover:bg-yellow-50 transition-all cursor-pointer group relative"
              >
                <div className="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity text-yellow-600"><Info size={16} /></div>
                <div>
                  <div className="font-bold text-stone-400 group-hover:text-yellow-700">Soldering Bay</div>
                  <div className="text-xs text-stone-400 group-hover:text-yellow-600">Occupied</div>
                </div>
              </button>
              <button
                onClick={() => setActiveInfoCard('cast')}
                className="bg-stone-100 rounded-2xl h-48 flex items-center justify-center p-8 text-center border-2 border-dashed border-stone-300 mt-8 hover:border-yellow-400 hover:bg-yellow-50 transition-all cursor-pointer group relative"
              >
                <div className="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity text-yellow-600"><Info size={16} /></div>
                <div>
                  <div className="font-bold text-stone-400 group-hover:text-yellow-700">Casting Rig</div>
                  <div className="text-xs text-stone-400 group-hover:text-yellow-600">Occupied</div>
                </div>
              </button>
            </div>
          </div>

          <div className="bg-white rounded-3xl p-8 border border-stone-200 shadow-lg">
            <div className="flex justify-between items-end mb-8">
              <div>
                <h3 className="text-2xl font-bold text-stone-900 font-serif">Upcoming Workshops</h3>
                <p className="text-stone-500 font-light">Learn from the masters of the click.</p>
              </div>
              <button className="text-yellow-600 font-bold hover:underline">Full Schedule</button>
            </div>
            <div className="divide-y divide-stone-100">
              {workshops.map((ws, i) => {
                const isJoined = joinedWorkshops.includes(i);
                return (
                  <div key={i} className={`py-6 flex items-center justify-between group transition-colors px-4 rounded-xl -mx-4 ${isJoined ? 'bg-green-50' : 'hover:bg-stone-50'}`}>
                    <div className="flex items-center gap-6">
                      <div className={`w-12 h-12 rounded-xl flex flex-col items-center justify-center font-bold border ${isJoined ? 'bg-green-100 text-green-700 border-green-200' : 'bg-stone-100 text-stone-600 border-stone-200'}`}>
                        {isJoined ? <CheckCircle size={18} /> : <Calendar size={16} />}
                      </div>
                      <div>
                        <h4 className="font-bold text-lg text-stone-900 group-hover:text-yellow-600 transition-colors font-serif">{ws.title}</h4>
                        <div className="flex items-center gap-3 text-sm text-stone-500">
                          <span>{ws.date}</span>
                          <span className="w-1 h-1 bg-stone-300 rounded-full"></span>
                          <span>{ws.type}</span>
                        </div>
                      </div>
                    </div>
                    <div className="text-right">
                      <div className={`font-mono text-sm font-bold ${ws.slots === 'FULL' ? 'text-red-500' : 'text-stone-400'}`}>
                        {ws.slots}
                      </div>
                      {ws.slots !== 'FULL' && (
                        <button
                          onClick={() => toggleJoin(i)}
                          className={`text-sm font-bold underline decoration-2 transition-colors ${isJoined ? 'text-green-600 decoration-green-400' : 'text-stone-900 decoration-yellow-400'}`}
                        >
                          {isJoined ? 'Registered' : 'Join'}
                        </button>
                      )}
                    </div>
                  </div>
                )
              })}
            </div>
          </div>
        </div>
      );
    }

    // --- Main App Component ---

    function ButtonEmporium() {
      const [currentView, setCurrentView] = useState('home');
      const [activeCategory, setActiveCategory] = useState('all');
      const [cart, setCart] = useState([]);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [clickCount, setClickCount] = useState(0);
      const [bigButtonState, setBigButtonState] = useState('idle');

      const addToCart = (product) => {
        setCart(prevCart => {
          const existingItem = prevCart.find(item => item.id === product.id);
          if (existingItem) {
            // If exists, increment quantity
            return prevCart.map(item =>
              item.id === product.id
                ? { ...item, quantity: item.quantity + 1 }
                : item
            );
          }
          // If new, add with quantity 1
          return [...prevCart, { ...product, quantity: 1 }];
        });
        setIsCartOpen(true);
      };

      const updateQuantity = (productId, delta) => {
        setCart(prevCart => prevCart.map(item => {
          if (item.id === productId) {
            return { ...item, quantity: Math.max(1, item.quantity + delta) };
          }
          return item;
        }));
      };

      const removeFromCart = (productId) => {
        setCart(prevCart => prevCart.filter(item => item.id !== productId));
      };

      // Calculate total with quantity
      const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      // Calculate total items for badge
      const cartItemCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      const handleBigButtonPress = () => {
        setBigButtonState('pressed');
        setClickCount(prev => prev + 1);
        setTimeout(() => setBigButtonState('idle'), 150);
      };

      const navItems = [
        { id: 'home', label: 'Home' },
        { id: 'store', label: 'Store' },
        { id: 'museum', label: 'Museum' },
        { id: 'maker', label: 'Maker Lab' },
        { id: 'about', label: 'About' },
      ];

      return (
        <div className="min-h-screen bg-stone-50 text-stone-800 selection:bg-yellow-200 flex flex-col font-sans">

          {/* Cart Drawer */}
          <CartDrawer
            isOpen={isCartOpen}
            onClose={() => setIsCartOpen(false)}
            cart={cart}
            updateQuantity={updateQuantity}
            removeFromCart={removeFromCart}
            total={cartTotal}
          />

          {/* Navigation */}
          <nav className="sticky top-0 z-50 bg-stone-900 text-stone-50 shadow-lg border-b-4 border-yellow-600/50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between h-16 items-center">
                {/* Logo */}
                <div
                  className="flex items-center gap-3 cursor-pointer touch-manipulation group"
                  onClick={() => setCurrentView('home')}
                >
                  {/* Replace 'your-logo.png' with your actual file name or URL */}
                  <img
                    src="https://www.buttons-boutique.com/media/catalog/product/cache/8636cbf365f25575e525bef82323f661/5/5/5589-230067.jpg"
                    alt="Push & Sew Logo"
                    className="w-10 h-10 object-contain rounded-full border-2 border-transparent group-hover:border-yellow-400 transition-all"
                  />
                  <span className="font-bold text-xl tracking-tight text-white group-hover:text-gold-gradient transition-all hidden sm:inline font-serif italic">Push & Sew</span>
                  <span className="font-bold text-xl tracking-tight text-white group-hover:text-gold-gradient transition-all sm:hidden font-serif italic">P&S</span>
                </div>

                {/* Desktop Nav */}
                <div className="hidden md:flex space-x-1">
                  {navItems.map(item => (
                    <button
                      key={item.id}
                      onClick={() => setCurrentView(item.id)}
                      className={`
                            px-3 py-2 rounded-lg text-sm font-bold transition-all
                            ${currentView === item.id
                          ? 'bg-stone-800 text-yellow-400 shadow-inner'
                          : 'text-stone-400 hover:text-white hover:bg-stone-800/50'}
                          `}
                    >
                      {item.label}
                    </button>
                  ))}
                </div>

                <div className="flex items-center gap-4">
                  <button
                    onClick={() => setIsCartOpen(true)}
                    className="relative group p-2 hover:bg-stone-800 rounded-lg transition-colors touch-manipulation"
                  >
                    <ShoppingCart className="w-6 h-6 text-stone-300 group-hover:text-yellow-400 transition-colors" />
                    {cartItemCount > 0 && (
                      <span className="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-stone-900 transform translate-x-1/4 -translate-y-1/4 bg-yellow-400 rounded-full shadow-sm border border-stone-900 font-mono">
                        {cartItemCount}
                      </span>
                    )}
                  </button>

                  <button className="md:hidden p-2 hover:bg-stone-800 rounded-lg touch-manipulation" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                    {isMenuOpen ? <X className="text-stone-300" /> : <Menu className="text-stone-300" />}
                  </button>
                </div>
              </div>
            </div>

            {/* Mobile Menu */}
            {isMenuOpen && (
              <div className="md:hidden bg-stone-800 border-t border-stone-700 animate-in slide-in-from-top-2">
                {navItems.map(item => (
                  <button
                    key={item.id}
                    onClick={() => { setCurrentView(item.id); setIsMenuOpen(false); }}
                    className={`
                          block w-full text-left px-6 py-4 text-base font-bold border-b border-stone-700 touch-manipulation
                          ${currentView === item.id ? 'text-yellow-400 bg-stone-900' : 'text-stone-300 active:bg-stone-700'}
                        `}
                  >
                    {item.label}
                  </button>
                ))}
              </div>
            )}
          </nav>

          {/* Main Content Area */}
          <main className="flex-grow">
            {currentView === 'home' && (
              <HomePage
                navigate={setCurrentView}
                clickCount={clickCount}
                handleBigButtonPress={handleBigButtonPress}
                bigButtonState={bigButtonState}
                setBigButtonState={setBigButtonState}
              />
            )}

            {currentView === 'store' && (
              <StorePage
                activeCategory={activeCategory}
                setActiveCategory={setActiveCategory}
                addToCart={addToCart}
              />
            )}

            {currentView === 'museum' && <MuseumPage />}
            {currentView === 'maker' && <MakerLabPage />}

            {currentView === 'about' && <AboutPage />}
          </main>

          {/* Footer */}
          <footer className="bg-stone-950 text-stone-500 py-12 border-t border-stone-900">
            <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-8">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-stone-900 flex items-center justify-center border border-stone-800">
                  <div className="w-4 h-4 rounded-full bg-gold-gradient"></div>
                </div>
                <span className="font-bold text-xl text-stone-300 font-serif italic">Push & Sew</span>
              </div>
              <div className="flex flex-wrap gap-8 text-sm font-medium justify-center">
                <button onClick={() => setCurrentView('about')} className="hover:text-yellow-400 touch-manipulation transition-colors">About</button>
                <button onClick={() => setCurrentView('store')} className="hover:text-yellow-400 touch-manipulation transition-colors">Store</button>
                <button onClick={() => setCurrentView('museum')} className="hover:text-yellow-400 touch-manipulation transition-colors">Museum</button>
                <button onClick={() => setCurrentView('maker')} className="hover:text-yellow-400 touch-manipulation transition-colors">Maker Lab</button>
              </div>
              <div className="text-sm font-light">
                © 2024 Push & Sew.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ButtonEmporium />);
  </script>
</body>

</html>
