<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A page that randomly gives a user a recipe.">
    <meta name="author" content="Daniel Checketts">

    <meta property="og:title" content="Recipe Book">
    <meta property="og:type" content="website">
    <meta property="og:description" content="A page that randomly gives a user a recipe.">
    <meta property="og:image" content="URL to an image">
    <meta property="og:url" content="jalozf.github.io/recipe-book">

    <title>Recipe Book</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- <script src="recipes.mjs" defer></script> || BELOW: type="module" -->
    <script src="main.js" defer></script>
</head>
<body>
    <header>
        <img src="images/recipe-book.png" alt="Recipe Book Logo">
        <h1>Recipe Book</h1>
    </header>
    <main>
        <div class="search-form">
            <label for="search" class="hidden">Search</label>
            <input type="text" placeholder="Find a recipe" id="search">
            <button type="submit"><img src="images/search.svg" alt="Search Icon"></button>
        </div>
        <section id="recipes">
            
        </section>
    </main>
    <footer>
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
    </footer>
</body>
</html>
