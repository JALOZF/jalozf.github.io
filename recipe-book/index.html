<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recepie Book</title>
        <link rel="stylesheet" href="styles.css">
        <script src="main.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Recipie Book</h1>
            <img src="images/recipe-book.png" alt="Recipie Book">
            <div class="search">
                <label for="searchbar" class="hidden">Search</label>
            <input type="text" name="search" id="searchbar" placeholder="Search for a recipie!">
            <img src="images/search.svg" alt="Search icon">
            </div>
            
        </header> 
        <main>
            <figure class="recipe">
                <img src="images/apple-crisp.jpg" alt="image of apple crisp on a plate" />
                <figcaption>
                    <ul class="recipe__tags">
                        <li>Dessert</li>
                        <li>Fruit</li>
                    </ul>
                    <h2><a href="#">Apple Crisp</a></h2>
                    <p class="recipe__ratings">
                        <span
                            class="rating"
                            role="img"
                            aria-label="Rating: 3 out of 5 stars">
                            <span aria-hidden="true" class="icon-star">⭐</span>
                            <span aria-hidden="true" class="icon-star">⭐</span>
                            <span aria-hidden="true" class="icon-star">⭐</span>
                            <span aria-hidden="true" class="icon-star">⭐</span>
                            <span aria-hidden="true" class="icon-star-empty">☆</span>
                        </span>
                    </p>
                    <p class="recipe__description">
                        This apple crisp recipe is a simple yet delicious fall dessert
                        that's great served warm with vanilla ice cream.
                    </p>
            </figcaption>
            </figure>
        </main>
        <footer>
            <footer>
                <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons" class="tiny">Recipe icons created by Freepik - Flaticon</a>
                <div class="social">
                    <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
                    <a href="instagram"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
                    <a href="youtube"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
                    <a href="pinterest"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
                </div>
            </footer>
        </footer>
    </body>
</html>
